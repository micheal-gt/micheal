<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
  </defs>
  <!-- Main circular background simulating responsive native canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Minimalist tick ticks and outer clock face ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#27272a" stroke-width="4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00d8f6" stroke-width="2.5" stroke-dasharray="2 20" />
  
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#f4f4f5" stroke-width="8" stroke-linecap="round" transform="rotate(28, 256, 256)" />
  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="360" y2="256" stroke="#a1a1aa" stroke-width="5" stroke-linecap="round" transform="rotate(145, 256, 256)" />
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="10" fill="#00d8f6" />
  <circle cx="256" cy="256" r="5" fill="#09090b" />
</svg>
